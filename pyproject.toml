[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellfactory"
version = "0.1.0"
description = "Simulate a microbe turning a substrate into a product with constraint-based models"
requires-python = ">=3.10"
dependencies = [
    "cobra>=0.29",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
checks = ["memote>=0.17"]
thermo = ["equilibrator-api>=0.8.1"]  # ships its compound data, so it works offline
design = ["straindesign>=1.19"]  # brings SCIP (pyscipopt) as its MILP solver
mcp = ["mcp>=1.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "fastapi>=0.110", "uvicorn>=0.29", "httpx", "jupyterlab", "nbclient", "ipykernel", "mcp>=1.10", "equilibrator-api>=0.8.1; python_version >= '3.11'", "straindesign>=1.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cellfactory.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Solver status is 'infeasible'", "ignore:Attribute name 'registry':Warning"]

[project.scripts]
cellfactory = "cellfactory.cli:main"
cellfactory-mcp = "cellfactory.mcp_server:main"
cellfactory-api = "cellfactory.api:main"

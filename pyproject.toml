[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellfactory"
version = "0.1.0"
description = "Simulate a microbe turning a substrate into a product with constraint-based models"
requires-python = ">=3.10"
dependencies = [
    "cobra>=0.29",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
checks = ["memote>=0.17"]
mcp = ["mcp>=1.10"]
dev = ["pytest", "jupyterlab", "nbclient", "ipykernel", "mcp>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Solver status is 'infeasible'"]

[project.scripts]
cellfactory = "cellfactory.cli:main"
cellfactory-mcp = "cellfactory.mcp_server:main"
